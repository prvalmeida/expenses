# Local development / parity only. In the cloud the app runs from the `runner`
# image with secrets injected at runtime and points at a managed MongoDB via
# MONGODB_URI — the bundled `mongodb` service below is not used in the cloud.
services:
  app:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./:/app
      - /app/node_modules
      # Keep the container's build dir off the host bind mount: Turbopack writes
      # relative symlinks for serverExternalPackages, which land on NTFS as
      # invalid (relative) junctions and make a host `npm run dev` panic with
      # "failed to create junction point ... (os error 80)".
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/expenses?authSource=admin
    command: npm run dev
    working_dir: /app
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    # OPENAI_API_KEY / PDF_KEY are supplied at runtime, not baked into the image.
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/expenses?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:
