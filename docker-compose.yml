# Local development / parity only. In the cloud the app runs from the `runner`
# image with secrets injected at runtime and points at a managed MongoDB via
# MONGODB_URI — the bundled `mongodb` service below is not used in the cloud.
services:
  app:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./:/app
      - /app/node_modules
      # Keep the container's build dir off the host bind mount: Turbopack writes
      # relative symlinks for serverExternalPackages, which land on NTFS as
      # invalid (relative) junctions and make a host `npm run dev` panic with
      # "failed to create junction point ... (os error 80)".
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # MONGO_USER / MONGO_PASSWORD are interpolated by Compose from the host env
      # or a root `.env` — never from `.env.local`, which Compose only loads via
      # `env_file` (see `web` below).
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/expenses?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    # MONGODB_URI / OPENAI_API_KEY / PDF_KEY come from `.env.local` at runtime,
    # never baked into the image. MONGODB_URI is deliberately NOT set below:
    # `environment` outranks `env_file`, so hardcoding it here would silently
    # redirect a managed-database URI to the bundled `mongodb` service.
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8
    # Published on 27018 because a native Windows MongoDB service binds
    # 127.0.0.1:27017 and shadows Docker's 0.0.0.0 bind for localhost clients
    # (Compass, mongosh). Only the host side moves — in-network clients still
    # reach this service at mongodb:27017.
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:
