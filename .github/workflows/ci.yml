name: CI

# A single `push` block listing both `branches` and `tags` fires on either.
# The tag trigger is required so that a `vX.Y.Z` push also produces the
# `lint` / `build` jobs that the `docker` job declares as `needs`.
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

# Pushes to a branch of this repo fire twice (push + pull_request). Keying on
# `github.ref` alone would NOT dedupe them — on a pull_request event the ref is
# `refs/pull/N/merge`, a different group from `refs/heads/<branch>`. Falling
# back through `head_ref` puts both events in the same branch-named group so
# one cancels the other. On tag pushes head_ref is empty, so each tag still
# gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci (not install) matches the Dockerfile `deps` stage and fails
      # loudly on package-lock.json drift.
      - run: npm ci --no-audit --no-fund

      # Bare `eslint` exits 1 on errors but 0 on warnings; --max-warnings=0
      # makes a warning-only regression fail CI too.
      - run: npx eslint --max-warnings=0

  build:
    name: Build
    runs-on: ubuntu-latest
    # No `needs`: runs in parallel with lint so a type error and a lint error
    # surface in the same run rather than serially.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # No brace expansion in these globs: hashFiles() uses @actions/glob,
          # which runs minimatch with nobrace — `*.{ts,tsx}` would match nothing
          # and silently freeze the key, so the cache would never invalidate.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'hooks/**', 'types/**', '*.ts', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # No secrets are injected on purpose: MONGODB_URI is read inside
      # connectToDatabase() (lib/mongodb.ts) and OPENAI_API_KEY inside
      # getOpenAI() (lib/openai.ts), never at module load. `next build` needs
      # neither. Adding placeholders would mask a future regression where
      # something *does* connect at build time.
      - run: npm run build

  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # fetch-depth: 0 is mandatory — the default shallow checkout makes the
      # ancestry check below silently unreliable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitHub Actions has no native "tag on branch X" trigger filter, so a
      # tag pushed from a feature branch would otherwise publish and release.
      - name: Assert tagged commit is an ancestor of main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not reachable from main. Releases must be tagged on main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is reachable from main."

  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [lint, build, verify-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false disables the built-in floating tag so it can be
          # re-added below for stable releases only.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # No `target`: the Dockerfile's final stage is `runner`. Setting a target
      # would ship the hot-reload `dev` stage instead.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    runs-on: ubuntu-latest
    # Gating on docker guarantees a release never points at a version with no
    # published image. The "tag on main" check is inherited transitively.
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
